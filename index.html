<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>På perrongen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050609;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #e8e3d8;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Stage ---------- */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    /* Subtle vignette across whole scene */
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, #0b0d14 0%, #06070b 70%, #030305 100%);
  }

  /* All depth layers use clip-path polygons that converge to the VP.
     VP = (50%, 75%). Bottom of stage = 100%.
     Platform at the VP spans 42%–58% (16% wide — was 9%) so the far end
     of the platform is more visible. */
  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* ---------- Ceiling / tunnel mouth ---------- */
  .ceiling {
    background:
      /* warm tunnel mouth haze at VP */
      radial-gradient(ellipse 14% 6% at 50% 75%, rgba(220,170,110,0.10), transparent 70%),
      /* recessive gradient toward VP */
      linear-gradient(180deg, #0c0e15 0%, #0a0c13 60%, #06070b 100%);
    clip-path: polygon(0 0, 100% 0, 100% 75%, 0 75%);
  }
  /* Ceiling light strips — thin warm-white bars receding to VP, drawn as trapezoids via SVG below */

  /* ---------- Back tunnel (the tiny dark patch right at the VP) ---------- */
  .back-tunnel {
    background:
      radial-gradient(ellipse at center, #1a1410 0%, #050306 80%);
    clip-path: polygon(42% 75%, 58% 75%, 58% 77%, 42% 77%);
  }

  /* ---------- Rail trench, LEFT ---------- */
  /* Platform widened 50% (bottom 12.5%-87.5%, was 25%-75%) — rails get
     thinner accordingly. */
  .rail-left {
    background:
      /* far-end darkening */
      linear-gradient(180deg, #030303 0%, #060505 35%, #0d0a08 100%);
    clip-path: polygon(42% 75%, 8% 100%, 0 100%, 0 100%, 40% 75%);
  }

  /* ---------- Rail trench, RIGHT ---------- */
  .rail-right {
    background:
      linear-gradient(180deg, #030303 0%, #060505 35%, #0d0a08 100%);
    clip-path: polygon(60% 75%, 100% 100%, 92% 100%, 58% 75%);
  }

  /* ---------- Platform floor ----------
     Kept dark and muted on purpose — the screen + child are the focal
     points, the floor reads as ambient surface, not a hero element. */
  .platform {
    background:
      /* tile suggestion: faint horizontal banding fading into distance */
      repeating-linear-gradient(180deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 28px),
      /* dim concrete with atmospheric perspective */
      linear-gradient(180deg,
        #0d1116 0%,
        #161b22 25%,
        #232a33 55%,
        #2e3640 85%,
        #353d47 100%);
    clip-path: polygon(42% 75%, 58% 75%, 92% 100%, 8% 100%);
  }

  /* Platform — yellow safety stripes along the edges (one per side).
     Kept dim so they don't pull focus from the screen + child. */
  .safety-left, .safety-right {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      /* dashed warning chevron pattern (muted) */
      repeating-linear-gradient(135deg,
        #6a5320 0px, #6a5320 8px,
        #0e0a05 8px, #0e0a05 14px);
    opacity: 0.5;
    filter: brightness(0.85);
  }
  .safety-left  { clip-path: polygon(41.4% 75%, 42% 75%, 8% 100%, 5.5% 100%); }
  .safety-right { clip-path: polygon(58% 75%, 58.6% 75%, 94.5% 100%, 92% 100%); }

  /* ---------- Rail tracks SVG (4 metal lines + sleepers) ---------- */
  .tracks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------- Fog at VP ---------- */
  .haze {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 20% 8% at 50% 76%, rgba(180,150,110,0.16), transparent 70%);
    mix-blend-mode: screen;
  }

  /* ---------- Ceiling light fixtures (long thin bars in ceiling area) ---------- */
  .lights {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------- Floor / surround glow from the screen ---------- */
  .floor-glow {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: 60vw;
    height: 18vw;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
      rgba(255,225,180,0.55) 0%,
      rgba(255,210,160,0.28) 30%,
      transparent 70%);
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 5;
  }
  /* Soft halo around the screen — brighter so the surround reads as lit. */
  .screen-halo {
    position: absolute;
    left: 50%;
    bottom: 32%;
    width: 50vw;
    height: 88vh;
    max-height: 820px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 50%,
      rgba(255,230,190,0.38) 0%,
      rgba(255,220,180,0.18) 25%,
      transparent 60%);
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 6;
    filter: blur(6px);
  }

  /* ---------- Train GIF passing on the LEFT rail ---------- */
  .train-gif {
    position: absolute;
    /* Sits in the left rail trench, behind the screen halo and silhouette */
    bottom: 4vh;
    left: -8vw;
    width: 62vw;
    height: auto;
    z-index: 7;
    pointer-events: none;
    /* Tilt to track the LEFT rail receding to the VP. */
    transform: rotate(-8deg);
    transform-origin: 0% 100%;
    /* lighten = max(scene, train) per channel. The train body is near-black,
       so it disappears into the dark rail trench; only the warm lit windows
       and the bright headlight streaks survive — exactly the "light traces
       of a passing train" feel we want. */
    mix-blend-mode: lighten;
    /* Wider feather on every edge so the rectangular GIF frame dissolves
       gradually rather than ending in a soft-but-still-visible line. */
    -webkit-mask-image:
      linear-gradient(to right,  transparent 0%, #000 26%, #000 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 38%, #000 78%, transparent 100%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right,  transparent 0%, #000 26%, #000 70%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 38%, #000 78%, transparent 100%);
            mask-composite: intersect;
    /* Dim + desaturate + faint blue shift to sit in the platform's cool
       night palette; a hint of blur softens motion edges. */
    filter: brightness(0.78) saturate(0.7) contrast(1.05) hue-rotate(-8deg) blur(0.6px);
  }

  /* ---------- Child's cast shadow on the platform floor ----------
     Long shadow stretching toward the viewer — light source is the warm
     screen BEHIND the child, so the shadow falls forward (down the frame).
     We re-draw the silhouette in an SVG, anchor it at the feet, flip
     vertically so the head points down/forward, then scale + blur to
     sell the projection. */
  .child-shadow {
    position: absolute;
    left: 50%;
    /* Anchor the shadow's feet exactly where the child's feet sit. */
    bottom: 18%;
    height: 30vh;
    width: auto;
    aspect-ratio: 200 / 600;
    /* Anchor the bottom edge (= feet) at left:50% / bottom:18%, then
       flip vertically so head points toward viewer, stretch to ~2.3×
       and squash horizontally slightly so it tapers like a cast shadow. */
    /* Flip-anchor at the shoe-bottom (y=574 in a viewBox running -22..578,
       i.e. ~99.3% of the SVG element height) so the shadow's feet land
       exactly on the silhouette's feet \u2014 not at the SVG element edge,
       which leaves a hairline gap. */
    transform: translateX(-50%) scaleY(-2.6) scaleX(0.95);
    transform-origin: 50% 99.3%;
    filter: opacity(0.75);
    /* Bottom of shadow (= back at feet) crisp; tip (head, far from feet)
       fades into the floor. After scaleY(-1) the visual "tip" is at the
       TOP of the unflipped SVG, so the gradient mask runs feet → head
       = solid → transparent in source coords. */
    -webkit-mask-image: linear-gradient(to top,
      #000 0%, #000 20%, rgba(0,0,0,0.6) 55%, rgba(0,0,0,0.2) 80%, transparent 100%);
            mask-image: linear-gradient(to top,
      #000 0%, #000 20%, rgba(0,0,0,0.6) 55%, rgba(0,0,0,0.2) 80%, transparent 100%);
    z-index: 24;            /* one below .child (z-index:25) */
    pointer-events: none;
  }
  .child-shadow path { fill: #000; }


  /* ---------- Child silhouette (standing in front of the screen) ---------- */
  .child {
    position: absolute;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);
    height: 30vh;
    width: auto;
    z-index: 25;
    pointer-events: none;
    /* No filters — silhouette renders with native crisp SVG edges. */
  }

  /* ---------- Display rig (screen sits directly on the floor) ---------- */
  .display-rig {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    width: 19vw;
    max-width: 340px;
    min-width: 220px;
    z-index: 10;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .train-gif { display: none !important; }
    .display-rig {
      width: 72vw;
      min-width: 0;
      bottom: 10%;
    }
    .child {
      height: 18vh;
      bottom: 10%;
    }
    .child-shadow {
      height: 18vh;
      bottom: 10%;
    }
    .floor-glow {
      bottom: 6%;
      width: 90vw;
      height: 28vw;
    }
    .screen-halo {
      bottom: 20%;
      width: 80vw;
    }
    .change-btn {
      opacity: 1 !important;
      transform: translate(-50%, 0) !important;
    }
    .hint {
      font-size: 11px;
      padding: 8px 14px;
      white-space: nowrap;
    }
    .stop-sign { font-size: 11px; top: 14px; left: 16px; }
    .timetable { font-size: 10px; top: 14px; right: 16px; }
  }

  .display-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: linear-gradient(180deg, #0c0c10 0%, #0a0a0e 100%);
    border-radius: 14px;
    padding: 14px 14px 22px 14px;
    /* Brighter warm halo — the screen is clearly glowing. */
    box-shadow:
      0 0 0 1.5px #1c1c22,
      0 2px 0 #050507 inset,
      0 -1px 0 #1f1f25 inset,
      0 0 80px 14px rgba(255,210,160,0.55),
      0 30px 100px -10px rgba(255,190,130,0.60),
      0 0 160px 20px rgba(255,180,120,0.30);
    pointer-events: auto;
  }

  /* tiny indicator dots above the screen (camera/sensor — just decorative) */
  .display-frame::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 28%;
    height: 4px;
    background: #060608;
    border-radius: 3px;
  }

  .screen {
    position: relative;
    width: 100%;
    height: calc(100% - 24px);
    background:
      radial-gradient(ellipse 80% 60% at 50% 35%, rgba(255,230,180,0.45), transparent 70%),
      linear-gradient(180deg, #ead7b0 0%, #e2b574 45%, #b97b3a 100%);
    border-radius: 6px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #2a2a30 inset,
      0 0 40px rgba(255,210,150,0.45) inset;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen.dragging { cursor: grabbing; }

  /* Each ad is a layer that slides from above on entry / falls below on exit. */
  .ad-layer {
    position: absolute !important;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    transform: translateY(-100%);
    transition: transform 850ms cubic-bezier(.7, .02, .2, 1);
  }
  .ad-layer.current { transform: translateY(0); }
  .ad-layer.exit    { transform: translateY(100%); }

  /* tiny corner brand */
  .brand-strip {
    position: absolute;
    bottom: 6px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: rgba(232,227,216,0.45);
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Subtle scanline / screen-on glow over the ad to sell the "real screen" feel */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), transparent 30%, transparent 70%, rgba(0,0,0,0.18)),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.04) 3px 4px);
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 3;
  }
  /* Outer glass reflection */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(115deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 65%, rgba(255,255,255,0.04) 100%);
    pointer-events: none;
    z-index: 4;
  }

  /* Floor-mounted contact shadow for the screen */
  .display-rig::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    width: 105%;
    height: 18px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 70%);
    pointer-events: none;
  }

  /* ---------- Helper hint ---------- */
  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,14,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(232,227,216,0.85);
    z-index: 100;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint svg { opacity: 0.7; }
  .hint-mobile { display: none; }
  @media (max-width: 600px) {
    .hint-desktop { display: none; }
    .hint-mobile  { display: inline; }
  }
  .hint kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    color: #d4a738;
    border: 1px solid rgba(255,255,255,0.07);
  }

  /* Project title — top corner */
  .stop-sign {
    position: fixed;
    top: 22px;
    left: 28px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(232,227,216,0.85);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stop-sign .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #d4a738;
    box-shadow: 0 0 12px #d4a738;
  }
  .stop-sign .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: rgba(232,227,216,0.4);
    font-weight: 400;
    text-transform: uppercase;
    margin-left: 2px;
  }

  /* Departure indicator — top right (just chrome flavor) */
  .timetable {
    position: fixed;
    top: 22px;
    right: 28px;
    z-index: 100;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(232,227,216,0.55);
    text-align: right;
    line-height: 1.65;
  }
  .timetable b {
    color: #d4a738;
    font-weight: 500;
  }

  /* ---------- Floating "change image" action ----------
     The image-slot ships with a Replace button, but it sits below the slot
     and gets clipped by .screen's overflow:hidden — plus the parked layers
     are offscreen via transform. So we expose one external action that
     forwards to whichever ad is currently visible. */
  .change-btn {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 14px);
    transform: translate(-50%, 4px);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(10,10,14,0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(232,227,216,0.92);
    font: 500 12px/1 'Inter', -apple-system, system-ui, sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 220ms ease, transform 220ms ease, background 160ms ease;
    white-space: nowrap;
    z-index: 30;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      0 0 0 1px rgba(0,0,0,0.4);
  }
  .change-btn svg { color: #d4a738; }
  .display-rig:hover .change-btn,
  .change-btn:focus-visible,
  .change-btn:hover {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .change-btn:hover { background: rgba(20,18,14,0.88); }
  .change-btn:active { transform: translate(-50%, 1px); }

  /* Image-slot overrides — make the empty-state "glow" so the silhouette
     in front of the screen reads as a clean cutout against bright content. */
  image-slot {
    --slot-bg: rgba(255,255,255,0.04);
  }
  image-slot::part(empty) {
    background:
      radial-gradient(ellipse 80% 60% at 50% 35%, rgba(255,230,180,0.45), transparent 70%),
      linear-gradient(180deg, #ead7b0 0%, #e2b574 45%, #b97b3a 100%);
    color: rgba(40,28,18,0.65);
  }
  image-slot::part(frame) {
    background:
      radial-gradient(ellipse 80% 60% at 50% 35%, rgba(255,230,180,0.45), transparent 70%),
      linear-gradient(180deg, #ead7b0 0%, #e2b574 45%, #b97b3a 100%);
  }
</style>
</head>
<body>

<div class="scene" style="color: rgb(219, 209, 195)">

  <!-- Layered backdrop -->
  <div class="layer ceiling"></div>
  <div class="layer rail-left"></div>
  <div class="layer rail-right"></div>
  <div class="layer platform"></div>
  <div class="layer safety-left"></div>
  <div class="layer safety-right"></div>
  <div class="layer back-tunnel"></div>

  <!-- Sleepers + metal tracks, drawn in SVG so we control perspective precisely -->
  <svg class="tracks" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="rail-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a3a40" stop-opacity="0"/>
        <stop offset="35%" stop-color="#6a6a72" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#aeaeb6" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="sleeper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a120a"/>
        <stop offset="100%" stop-color="#2c1f12"/>
      </linearGradient>
    </defs>

    <!-- LEFT rail bed: sleepers as thin trapezoids stacked back-to-front along the trench -->
    <g id="sleepers-left"></g>
    <!-- RIGHT rail bed sleepers -->
    <g id="sleepers-right"></g>

    <!-- LEFT rail: outer track (further from platform) -->
    <polygon points="40.3,75 40.7,75 2.6,100 1,100" fill="url(#rail-metal)"/>
    <!-- LEFT rail: inner track (closer to platform) -->
    <polygon points="41.5,75 41.9,75 7.4,100 5.8,100" fill="url(#rail-metal)"/>

    <!-- RIGHT rail: inner track -->
    <polygon points="58.1,75 58.5,75 94.2,100 92.6,100" fill="url(#rail-metal)"/>
    <!-- RIGHT rail: outer track -->
    <polygon points="59.3,75 59.7,75 99,100 97.4,100" fill="url(#rail-metal)"/>
  </svg>

  <!-- Ceiling lights — long thin warm-white strips converging to VP -->
  <svg class="lights" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="light-strip" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#f4d8a8" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#f4d8a8" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <!-- Two long ceiling strips on either side of center -->
    <polygon points="49.3,75 49.6,75 35,0 30,0" fill="url(#light-strip)" opacity="0.55"/>
    <polygon points="50.4,75 50.7,75 70,0 65,0" fill="url(#light-strip)" opacity="0.55"/>
    <!-- Far-back rim light on the back tunnel arch -->
    <ellipse cx="50" cy="75" rx="6" ry="0.8" fill="#d4a738" opacity="0.35"/>
  </svg>

  <!-- Haze at vanishing point -->
  <div class="haze"></div>

  <!-- Warm halo + floor puddle from the screen -->
  <div class="screen-halo"></div>
  <div class="floor-glow"></div>

  <!-- Train GIF passing on the LEFT rail.
       The GIF animates the passing motion itself, so we only handle
       positioning + edge-feathering to dissolve the rectangular frame
       into the scene. -->
  <img class="train-gif" src="uploads/trainpassingby.gif" alt="" aria-hidden="true">

  <!-- Cast shadow on the platform floor, projecting forward from the
       child's feet toward the viewer. Uses a TAPERED variant of the
       child's silhouette (wider toward the head, narrower toward the
       feet) so once flipped + stretched it reads like a cast shadow
       on the ground with the tip slightly broader than the base. -->
  <svg class="child-shadow" viewBox="0 -22 200 600" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <!-- Body: tapered. Upper section (head, neck base, shoulders) widened
         ~20% past the source silhouette; mid + legs match the child so
         the shoes still align cleanly to the figure. -->
    <path d="
      M 100 4
      C 150 4, 175 32, 175 70
      C 175 96, 150 118, 126 126
      L 126 138
      C 158 144, 184 168, 186 204
      L 180 296
      L 168 320
      L 160 446
      L 150 550
      L 116 550
      L 108 400
      L 100 392
      L 92 400
      L 84 550
      L 50 550
      L 40 446
      L 32 320
      L 20 296
      L 14 204
      C 16 168, 42 144, 74 138
      L 74 126
      C 50 118, 25 96, 25 70
      C 25 32, 50 4, 100 4 Z"/>
    <!-- Hair: widened to match the wider head. -->
    <path d="
      M 28 32
      C 28 14, 34 2, 42 0
      L 50 -14 L 62 4 L 76 -18 L 90 -2 L 102 -24 L 112 -2 L 124 -18 L 138 2 L 150 -12 L 158 4
      C 166 6, 172 18, 172 32
      C 158 22, 140 18, 122 20
      C 108 22, 100 20, 92 20
      C 74 18, 46 22, 28 32 Z"/>
    <path d="M 46 542 L 88 542 C 94 550, 96 562, 92 570 C 86 574, 50 574, 44 570 C 40 562, 42 550, 46 542 Z"/>

<script>
  /* -------- Generate perspective-correct sleepers for the rail trenches --------
     Sleepers (railroad ties) get smaller and closer-together toward the VP.
     We place them at exponentially-decreasing y-positions so the spacing
     matches inverse-distance falloff. */
  (function buildSleepers() {
    const left  = document.getElementById('sleepers-left');
    const right = document.getElementById('sleepers-right');
    const VP_Y = 75;
    const N = 18;
    for (let i = 0; i < N; i++) {
      // t goes 0 (near, big) → 1 (far, tiny)
      const t = i / N;
      // non-linear so sleepers cluster toward the VP
      const k = Math.pow(t, 1.4);
      const y = VP_Y + (100 - VP_Y) * (1 - k);
      const ySpan = (100 - VP_Y) * 0.012 * (1 - k * 0.9);
      // LEFT rail boundary x-coords at this y (linear interp from VP to bottom)
      // VP: x in [40, 42]; bottom: x in [0, 8]
      const f = (y - VP_Y) / (100 - VP_Y); // 0 at VP, 1 at bottom
      const lx1 = 40 + (0    - 40) * f;
      const lx2 = 42 + (8    - 42) * f;
      const lx1b = 40 + (0    - 40) * (f + ySpan/(100-VP_Y));
      const lx2b = 42 + (8    - 42) * (f + ySpan/(100-VP_Y));
      const lp = `${lx1},${y} ${lx2},${y} ${lx2b},${y+ySpan} ${lx1b},${y+ySpan}`;
      const lEl = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      lEl.setAttribute('points', lp);
      lEl.setAttribute('fill', 'url(#sleeper)');
      lEl.setAttribute('opacity', (0.3 + 0.65 * f).toFixed(2));
      left.appendChild(lEl);

      // RIGHT rail boundary x-coords at this y
      // VP: x in [58, 60]; bottom: x in [92, 100]
      const rx1 = 58 + (92   - 58) * f;
      const rx2 = 60 + (100  - 60) * f;
      const rx1b = 58 + (92   - 58) * (f + ySpan/(100-VP_Y));
      const rx2b = 60 + (100  - 60) * (f + ySpan/(100-VP_Y));
      const rp = `${rx1},${y} ${rx2},${y} ${rx2b},${y+ySpan} ${rx1b},${y+ySpan}`;
      const rEl = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      rEl.setAttribute('points', rp);
      rEl.setAttribute('fill', 'url(#sleeper)');
      rEl.setAttribute('opacity', (0.3 + 0.65 * f).toFixed(2));
      right.appendChild(rEl);
    }
  })();

  /* -------- Ad rotator: auto every 8s + manual swipe-up drag --------
     Both auto and manual paths drive the layers via inline transforms so
     they share one source of truth. Direction: "current" goes up & out,
     "next" rises from below — matching the swipe-up gesture. */
  (function adRotator() {
    const screen = document.getElementById('screen');
    const layers = Array.from(document.querySelectorAll('.ad-layer'));
    if (!screen || layers.length < 2) return;

    const T          = 850;    // must match .ad-layer CSS transition
    const AUTO_MS    = 8000;   // dwell between auto-advances
    const RESUME_MS  = 4000;   // wait after user interaction before resuming auto
    const COMMIT_PCT = 18;     // must drag this far (% of screen height) to flip
    const FLICK_VEL  = 0.6;    // px/ms — fast upward flick also commits

    let currentIdx = 0;

    // Reset: ad[0] visible, all others parked below.
    layers.forEach((l, i) => {
      l.classList.remove('current', 'exit');
      l.style.transition = 'none';
      l.style.transform  = i === 0 ? 'translateY(0)' : 'translateY(100%)';
    });
    void screen.offsetHeight;
    layers.forEach(l => { l.style.transition = ''; });

    // ---- Auto rotate ----
    let autoTimer = null;
    function startAuto() {
      stopAuto();
      autoTimer = setInterval(advance, AUTO_MS);
    }
    function stopAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
    }
    function advance() {
      const cur = layers[currentIdx];
      const nxt = layers[(currentIdx + 1) % layers.length];
      // Make sure the incoming ad is parked below (it always is, but if a
      // half-finished drag was just snapped back it's already at +100% — fine).
      nxt.style.transition = 'none';
      nxt.style.transform  = 'translateY(100%)';
      void nxt.offsetHeight;
      nxt.style.transition = '';
      // Animate.
      cur.style.transform = 'translateY(-100%)';
      nxt.style.transform = 'translateY(0)';
      currentIdx = (currentIdx + 1) % layers.length;
    }

    // ---- Manual drag-to-swipe-up ----
    let dragging   = false;
    let pid        = null;
    let startY     = 0;
    let lastY      = 0;
    let lastT      = 0;
    let velocity   = 0; // px/ms, negative = upward
    let dy         = 0;
    let H          = 0;
    let activeNext = -1;
    let resumeTimer = null;

    function scheduleResume() {
      if (resumeTimer) clearTimeout(resumeTimer);
      resumeTimer = setTimeout(startAuto, RESUME_MS);
    }

    screen.addEventListener('pointerdown', (e) => {
      // ignore right/middle mouse buttons
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      stopAuto();
      if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }

      dragging   = true;
      pid        = e.pointerId;
      startY     = e.clientY;
      lastY      = e.clientY;
      lastT      = performance.now();
      velocity   = 0;
      dy         = 0;
      H          = screen.clientHeight;
      activeNext = (currentIdx + 1) % layers.length;

      const cur = layers[currentIdx];
      const nxt = layers[activeNext];
      cur.style.transition = 'none';
      nxt.style.transition = 'none';
      cur.style.transform  = 'translateY(0)';
      nxt.style.transform  = 'translateY(100%)';

      screen.classList.add('dragging');
      try { screen.setPointerCapture(pid); } catch (_) {}
      e.preventDefault();
    });

    screen.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid) return;
      const now = performance.now();
      const ddy = e.clientY - lastY;
      const ddt = Math.max(1, now - lastT);
      // EMA on instantaneous velocity for a smoother flick reading
      velocity = velocity * 0.6 + (ddy / ddt) * 0.4;
      lastY = e.clientY;
      lastT = now;

      dy = e.clientY - startY;
      let pct = (dy / H) * 100;
      // light rubber-band if user pulls downward
      if (pct > 0) pct = pct * 0.25;
      if (pct < -100) pct = -100;

      layers[currentIdx].style.transform  = `translateY(${pct}%)`;
      layers[activeNext].style.transform  = `translateY(${100 + pct}%)`;
    });

    function endDrag(e) {
      if (!dragging) return;
      if (e && e.pointerId !== pid) return;
      dragging = false;
      screen.classList.remove('dragging');

      const cur = layers[currentIdx];
      const nxt = layers[activeNext];
      cur.style.transition = '';
      nxt.style.transition = '';

      const pct  = (dy / H) * 100;
      const flicked = velocity <= -FLICK_VEL && pct < -2; // upward flick
      const commit  = flicked || pct <= -COMMIT_PCT;

      if (commit) {
        cur.style.transform = 'translateY(-100%)';
        nxt.style.transform = 'translateY(0)';
        currentIdx = activeNext;
      } else {
        cur.style.transform = 'translateY(0)';
        nxt.style.transform = 'translateY(100%)';
      }
      scheduleResume();
    }

    screen.addEventListener('pointerup', endDrag);
    screen.addEventListener('pointercancel', endDrag);
    screen.addEventListener('lostpointercapture', endDrag);

    startAuto();

    // ---- External "Change image" button ----
    // The image-slot has a built-in Replace button (in its shadow DOM) that
    // calls the hidden file input. We just locate it on the current ad and
    // click it — same path as if the user had hovered the slot.
    const btn   = document.getElementById('changeBtn');
    const label = document.getElementById('changeBtnLabel');
    if (btn) {
      // Adapt copy depending on whether the visible slot is filled.
      function syncLabel() {
        const cur = layers[currentIdx];
        label.textContent = cur.hasAttribute('data-filled') ? 'Change image' : 'Add image';
      }
      // Re-sync whenever a slot's data-filled flips. MutationObserver fires
      // on any attribute change — cheap, and there are only 4 slots.
      const mo = new MutationObserver(syncLabel);
      layers.forEach(l => mo.observe(l, { attributes: true, attributeFilter: ['data-filled'] }));
      // Also re-sync on every swipe (currentIdx changed).
      const origAdvance = advance;
      // can't reassign const advance — patch via setInterval indirection:
      // simpler: poll on click instead. Cheap.
      syncLabel();

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const cur = layers[currentIdx];
        const root = cur.shadowRoot;
        if (!root) return;
        // Filled → hit the Replace button. Empty → click the empty-state
        // chrome (same path it uses internally to open the file picker).
        const target = cur.hasAttribute('data-filled')
          ? root.querySelector('[data-act="replace"]')
          : root.querySelector('.empty');
        if (target) target.click();
      });

      // Don't let pointerdown on the button start a screen-drag.
      btn.addEventListener('pointerdown', (e) => e.stopPropagation());

      // Keep the label in sync after any swipe (auto or manual) by polling
      // currentIdx via a lightweight ticker.
      let lastIdx = currentIdx;
      setInterval(() => {
        if (lastIdx !== currentIdx) { lastIdx = currentIdx; syncLabel(); }
      }, 200);
    }
  })();
</script>
